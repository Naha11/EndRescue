# Читать playerdata до входа игрока.
# Нужно, когда энд ВЫКЛЮЧЕН: мир не загружен, и узнать, что человек
# сохранился в энде, можно только из файла. Выключай, только если
# энд работает и такие игроки невозможны.
check-offline-data: true

# Отменять переход через портал в энд. Имеет смысл, когда энд включён,
# но заходить туда никому не нужно.
block-portals: true

# Сначала пробовать кровать игрока, и только если её нет - спавн мира.
# Человек возвращается домой, а не в толпу на спавне.
prefer-bed: true

# Куда отправлять, если кровати нет. По умолчанию - точка спавна мира.
custom-destination:
  enabled: false
  world: world
  x: 0.5
  y: 64.0
  z: 0.5

# Сообщение игроку. Формат MiniMessage. Пустая строка - не писать ничего.
message: "<gradient:#9b6bff:#ff2df1>Энд закрыт.</gradient> <gray>Мы вернули тебя на спавн.</gray>"
